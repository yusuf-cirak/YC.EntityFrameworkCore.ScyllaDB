name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: master

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - uses: actions/setup-dotnet@v6
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          global-json-file: global.json

      - name: Pack
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: dotnet pack src/YC.EntityFrameworkCore.ScyllaDB --configuration Release --output artifacts

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet key,
      # so there is no long-lived NUGET_API_KEY secret to leak or rotate.
      - name: NuGet login
        id: nuget-login
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
